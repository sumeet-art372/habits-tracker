<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habits & M.Pharm Tracker Dashboard</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
    
    <div class="max-w-3xl mx-auto">
        <!-- Header & Reset Button -->
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-emerald-400">Habits Dashboard</h1>
                <p class="text-slate-400 text-sm mt-1">M.Pharm & Daily Routine Tracker</p>
            </div>
            <button onclick="resetProgress()" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-xl shadow-lg transition-all text-sm">
                Reset All Progress
            </button>
        </header>

        <!-- Habit Container -->
        <main>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-semibold mb-4 text-slate-200">Today's Habits</h2>
                <div id="habits-list" class="space-y-3">
                    <!-- Habits will load dynamically here -->
                    <p class="text-slate-500 text-sm">Loading habits...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Fetch and display habits on load
        async function loadHabits() {
            try {
                const response = await fetch('/api/habits');
                const habits = await response.json();
                const container = document.getElementById('habits-list');
                
                if (habits.length === 0) {
                    container.innerHTML = `<p class="text-slate-500 text-sm">No habits configured yet.</p>`;
                    return;
                }

                container.innerHTML = '';
                habits.forEach(habit => {
                    // Check if logged for today (YYYY-MM-DD)
                    const today = new Date().toISOString().split('T')[0];
                    const isCompletedToday = habit.logs && habit.logs.some(log => log.date === today && log.completed);

                    const card = document.createElement('div');
                    card.className = `flex items-center justify-between p-4 rounded-xl border transition-all ${isCompletedToday ? 'bg-emerald-950/40 border-emerald-800/60' : 'bg-slate-800/40 border-slate-700/60'}`;
                    
                    card.innerHTML = `
                        <div>
                            <h3 class="font-medium text-slate-100">${habit.name}</h3>
                            <p class="text-xs text-slate-400">${habit.description || ''}</p>
                        </div>
                        <button onclick="toggleHabit(${habit.id})" class="px-4 py-2 rounded-lg font-medium text-sm transition-all ${isCompletedToday ? 'bg-emerald-600 text-white shadow-emerald-900/50 shadow-md' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}">
                            ${isCompletedToday ? 'Completed ✓' : 'Mark Done'}
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Error loading habits:", err);
            }
        }

        // Toggle habit completion explicitly on click
        async function toggleHabit(id) {
            try {
                const res = await fetch(`/api/habits/${id}/toggle`, { method: 'POST' });
                const result = await res.json();
                if (result.success) {
                    loadHabits(); // Refresh UI to match updated state
                }
            } catch (err) {
                console.error("Error toggling habit:", err);
            }
        }

        // Reset all progress history
        async function resetProgress() {
            if (!confirm("Are you sure you want to clear all progress logs? Your habit list will remain, but all checks will reset to zero.")) {
                return;
            }

            try {
                const res = await fetch('/api/habits/reset', { method: 'POST' });
                const result = await res.json();
                if (result.success) {
                    alert("Progress successfully reset!");
                    loadHabits(); // Refresh view
                } else {
                    alert("Failed to reset progress.");
                }
            } catch (err) {
                console.error("Reset error:", err);
                alert("Server error during reset.");
            }
        }

        // Initialize on page load
        loadHabits();
    </script>
</body>
</html>
